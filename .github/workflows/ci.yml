name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Gitleaks
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          tarball="tools/gitleaks/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" -C tools/gitleaks gitleaks
          tools/gitleaks/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: node scripts/lint-if-present.mjs

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Dist size budget
        if: ${{ !cancelled() }}
        run: node scripts/check-dist-size.mjs
